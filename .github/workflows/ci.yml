# Keep this filename: npm trusted publishing is configured for ci.yml.
name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Commit verified by ci_run_id (normal release only)
        type: string
      ci_run_id:
        description: Completed successful main CI run (normal release only)
        type: string
      recovery_run_id:
        description: Original Release run whose validated archives must be reused
        type: string

permissions: {}

concurrency:
  group: relkit-release-main
  cancel-in-progress: false
  queue: max

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CONCURRENCY: "1"
  VITEST_MAX_WORKERS: "1"
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  select-release-mode:
    name: Select release mode
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      sha: ${{ steps.select.outputs.sha }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_run_id: ${{ steps.select.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Verify the dispatched CI authority
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: bun scripts/release-ci-verification.ts
      - id: select
        name: Select the reviewed batch or original recovery archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || inputs.verified_sha }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: bun scripts/select-release.ts >> "$GITHUB_OUTPUT"

  version:
    name: Update release pull request
    if: needs.select-release-mode.outputs.mode == 'version'
    needs: select-release-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the release GitHub App
        env:
          APP_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$APP_ID" && test -n "$APP_KEY" || {
            echo "::error::Configure RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY; see CONTRIBUTING.md"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require the verified main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.select-release-mode.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          if test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$VERIFIED_SHA"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Main advanced; reconciliation will select its verified snapshot"
          fi
      - name: Restore the local Changesets base branch
        run: git branch --force main "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - id: release-app
        if: steps.current.outputs.ready == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the reviewed release pull request
        if: steps.current.outputs.ready == 'true'
        timeout-minutes: 20
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-app.outputs.token }}
          script: bun run version:packages
          commit-message: "chore: version RELKIT packages"
          pr-title: "chore: release RELKIT"
          pr-base-branch: main
      - name: Preserve failed creation certification reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-create-certification-${{ github.run_id }}
          path: ${{ runner.temp }}/relkit-create-certification-*/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Auto-merge after the actual pull request checks pass
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          pr_number="$(gh pr list --base main --head changeset-release/main --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          gh pr merge "$pr_number" --auto --squash

  pack:
    name: Build validated npm artifacts (${{ needs.select-release-mode.outputs.sha }})
    if: needs.select-release-mode.outputs.mode == 'publish'
    needs: select-release-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archives.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.select-release-mode.outputs.sha }}
      - name: Require the exact verified pack commit
        env:
          VERIFIED_SHA: ${{ needs.select-release-mode.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          git merge-base --is-ancestor "$VERIFIED_SHA" "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Build and validate the exact release archives
        run: bun run release:pack --ci-pack --output "$RUNNER_TEMP/npm-release"
      - name: Verify the release manifest independently
        run: node --experimental-strip-types scripts/publish-release.ts --directory "$RUNNER_TEMP/npm-release"
      - id: archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ needs.select-release-mode.outputs.sha }}
          path: ${{ runner.temp }}/npm-release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish npm and GitHub release
    if: >-
      !cancelled() && needs.select-release-mode.result == 'success' &&
      (needs.pack.result == 'success' || needs.select-release-mode.outputs.mode == 'recover') &&
      vars.NPM_RELEASES_ENABLED == 'true' && github.event.repository.visibility == 'public'
    needs: [select-release-mode, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Recovery uses the current trusted publisher code with the original artifact SHA.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.select-release-mode.outputs.artifact_id || needs.pack.outputs.artifact_id }}
          run-id: ${{ needs.select-release-mode.outputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: npm-release
      - name: Pin the npm trusted-publishing client
        run: npm install --global npm@11.19.0
      - name: Publish missing original archives in dependency order
        # The publisher has a 25-minute total budget and one shared 15-minute
        # visibility window, leaving time to preserve diagnostics and release assets.
        timeout-minutes: 30
        env:
          NPM_RELEASES_ENABLED: ${{ vars.NPM_RELEASES_ENABLED }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          RELEASE_SHA: ${{ needs.select-release-mode.outputs.sha }}
        run: node --experimental-strip-types scripts/publish-release.ts --directory npm-release --publish
      - name: Preserve npm diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publish-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: npm-release/publish.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Authenticate historical GitHub publication
        if: needs.select-release-mode.outputs.mode == 'recover' || needs.select-release-mode.outputs.sha != github.sha
        id: recovery-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ steps.recovery-app.outputs.token || github.token }}
          RELEASE_SHA: ${{ needs.select-release-mode.outputs.sha }}
        run: |
          version="$(jq -r .version npm-release/manifest.json)"
          tag="v$version"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || printf missing)"
          if test "$state" = false; then
            echo "$tag is already published"
            exit 0
          fi
          if test "$state" = missing; then
            gh release create "$tag" --draft --target "$RELEASE_SHA" --title "$tag" --notes-file npm-release/RELEASE_NOTES.md
          fi
          gh release upload "$tag" npm-release/*.tgz npm-release/SHA256SUMS npm-release/SHA512SUMS npm-release/manifest.json npm-release/RELEASE_NOTES.md --clobber
          latest="$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -f query='query($owner: String!, $repo: String!) { repository(owner: $owner, name: $repo) { latestRelease { tagName } } }' --jq '.data.repository.latestRelease.tagName // ""')"
          latest="${latest#v}"
          make_latest=true
          if [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && test "$(printf '%s\n' "$version" "$latest" | sort -V | tail -1)" != "$version"; then
            make_latest=false
          fi
          gh release edit "$tag" --draft=false --latest="$make_latest"

  reconcile:
    name: Reconcile newer main changes
    if: >-
      !cancelled() && needs.select-release-mode.result == 'success' &&
      (needs.select-release-mode.outputs.mode == 'none' ||
       needs.version.result == 'success' || needs.publish.result == 'success')
    needs: [select-release-mode, version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Continue with the latest successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SOURCE_SHA: ${{ needs.publish.result == 'success' && needs.select-release-mode.outputs.sha || '' }}
        run: bun scripts/select-release.ts --reconcile
