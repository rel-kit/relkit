# Keep this filename: npm trusted publishing is configured for ci.yml.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      verified_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string

permissions: {}

concurrency:
  group: relkit-release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  select-release-mode:
    name: Select release mode
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Require the verified main commit
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || inputs.verified_sha }}
        run: |
          test "$GITHUB_SHA" = "$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - name: Require a successful CI run for the dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" |
            jq -e --arg sha "$VERIFIED_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .name == "CI" and
              .path == ".github/workflows/checks.yml" and
              .head_branch == "main" and
              .head_repository.full_name == $repo and
              .head_sha == $sha and
              .status == "completed" and
              .conclusion == "success"
            '
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Update release pull request
    if: needs.select-release-mode.outputs.mode == 'version'
    needs: select-release-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Require the verified main commit
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_SHA" = "$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Create or update the reviewed release pull request
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ github.token }}
          script: bun run version:packages
          commit-message: "chore: version RELKIT packages"
          pr-title: "chore: release RELKIT"
          pr-base-branch: main
      - name: Verify and auto-merge the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base main --head changeset-release/main --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          gh workflow run checks.yml --ref changeset-release/main
          gh pr merge "$pr_number" --auto --squash
          for attempt in {1..120}; do
            state="$(gh pr view "$pr_number" --json state --jq .state)"
            if test "$state" = MERGED; then
              sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
              run_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/dispatches" -f ref=main -F return_run_details=true --jq .workflow_run_id)"
              test -n "$run_id"
              gh run watch "$run_id" --exit-status
              test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)" = "$sha"
              gh workflow run ci.yml --ref main -f verified_sha="$sha" -f ci_run_id="$run_id"
              exit 0
            fi
            test "$state" = OPEN
            sleep 15
          done
          echo "Timed out waiting for release pull request #$pr_number to merge" >&2
          exit 1

  pack:
    name: Build validated npm artifacts
    if: needs.select-release-mode.outputs.mode == 'publish'
    needs: select-release-mode
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Build and validate the exact release archives
        run: bun run scripts/release-check.ts --ci-pack --output "$RUNNER_TEMP/npm-release"
      - name: Verify the release manifest independently
        run: node --experimental-strip-types scripts/publish-release.ts --directory "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/npm-release
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish npm and GitHub release
    if: >-
      needs.pack.result == 'success' &&
      vars.NPM_RELEASES_ENABLED == 'true' &&
      github.event.repository.visibility == 'public'
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: npm-release
      - name: Pin the npm trusted-publishing client
        run: npm install --global npm@11.19.0
      - name: Publish missing archives in dependency order
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_RELEASES_ENABLED: ${{ vars.NPM_RELEASES_ENABLED }}
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          node --experimental-strip-types scripts/publish-release.ts --directory npm-release --publish
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="$(jq -r .version npm-release/manifest.json)"
          tag="v$version"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || printf missing)"
          if test "$state" = false; then
            echo "$tag is already published"
            exit 0
          fi
          if test "$state" = missing; then
            gh release create "$tag" --draft --target "$RELEASE_SHA" --title "$tag" --notes-file npm-release/RELEASE_NOTES.md
          fi
          gh release upload "$tag" npm-release/*.tgz npm-release/SHA256SUMS npm-release/SHA512SUMS npm-release/manifest.json npm-release/RELEASE_NOTES.md --clobber
          gh release edit "$tag" --draft=false
