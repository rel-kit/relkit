name: Workers runtime

# Nightly Tier 2 leg of the runtime matrix: the api template's HTTP suite against its
# `relkit build --runtime workers` bundle served by workerd (a pinned `wrangler dev`), and the
# Workers-compatible clients' conformance checks (Redis over HTTP, KV, R2 and Durable Object
# realtime) inside workerd. Tier 1 runtimes run on every pull request in checks.yml.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-runtime
  cancel-in-progress: false

jobs:
  workers-runtime:
    name: Runtime HTTP suite and conformance (Workers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TURBO_CONCURRENCY: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Build the packages the packed candidate needs
        run: >-
          bun x turbo run build --filter=./packages/* --filter=./integrations/*
          --filter=./integrations/packages/* --output-logs=errors-only
      - name: Run the api template's HTTP suite against its Workers bundle
        run: bun scripts/runtime-http-suite.ts --runtime workers
      - name: Run the Workers clients' conformance checks in workerd
        env:
          RELKIT_TEST_WORKERS: "1"
          RELKIT_TEST_DOCKER: "1"
        run: bun test integrations/packages/cloudflare/tests
