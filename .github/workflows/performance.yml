name: Startup performance

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    name: Strict packed startup performance
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_CONCURRENCY: "1"
      VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Require every packed start below one second
        timeout-minutes: 20
        run: bun scripts/certify-create.ts --performance
      - name: Preserve original performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-performance-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/relkit-create-certification-*/*.json
          if-no-files-found: warn
          retention-days: 7
