name: Cloudflare newcomer deploy

# Opt-in: deploys a throwaway Worker (relkit-test-<run id>) with its own queue and database, so it
# runs only when the repository variable RELKIT_TEST_CLOUDFLARE is "1", the CLOUDFLARE_API_TOKEN
# secret holds a token with Workers, Queues and Durable Objects edit permissions, the
# CLOUDFLARE_ACCOUNT_ID variable names the account, and the RELKIT_TEST_CLOUDFLARE_DATABASE_URL
# secret names a Postgres server the Worker can reach (its role creates and drops one database per
# run). The script deletes the Worker, the queue and the database in a finally block.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-newcomer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloudflare-newcomer:
    name: Deploy the api template to Cloudflare Workers
    if: ${{ vars.RELKIT_TEST_CLOUDFLARE == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELKIT_TEST_CLOUDFLARE: ${{ vars.RELKIT_TEST_CLOUDFLARE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      RELKIT_TEST_CLOUDFLARE_DATABASE_URL: ${{ secrets.RELKIT_TEST_CLOUDFLARE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun x turbo run build --filter='./packages/*' --filter='./integrations/packages/*' --concurrency=2 --output-logs=errors-only
      - name: Deploy, verify and delete the throwaway Worker
        run: bun scripts/cloudflare-newcomer.ts
