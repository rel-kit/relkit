name: Creation canary (candidate)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_CONCURRENCY: "1"
  VITEST_MAX_WORKERS: "1"
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  canary:
    name: Create ${{ matrix.template }} from this branch on the latest Bun
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, api, agent, fullstack, tasks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Build the packages the packed candidate needs
        run: >-
          bun x turbo run build --filter=./packages/* --filter=./integrations/*
          --filter=./integrations/packages/*
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Create, start and test the template with the packed creator
        run: bun scripts/creation-canary.ts --template "${{ matrix.template }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: creation-canary-${{ matrix.template }}-${{ github.run_attempt }}
          path: test-results/creation-canary
          if-no-files-found: ignore
          retention-days: 7
