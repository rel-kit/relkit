name: Newcomer walkthrough

# Times a newcomer's path from `create-relkit` to a route that answers on the dev server and writes
# the result for the metrics report. The Railway half of the walkthrough is the railway-newcomer
# workflow. Weekly and on demand; creation changes already run the creation canary on pull requests.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newcomer-walkthrough
  cancel-in-progress: false

jobs:
  first-route:
    name: Create to first route
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun x turbo run build --filter='./packages/*' --filter='./integrations/*' --filter='./integrations/packages/*' --concurrency=2 --output-logs=errors-only
      - name: Create a project, add a route and wait for the dev server to answer it
        run: bun scripts/walkthrough/create-to-first-route.ts --output "$RUNNER_TEMP/metrics/walkthrough-first-route.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: metrics-walkthrough-first-route-${{ github.run_id }}
          path: ${{ runner.temp }}/metrics/walkthrough-first-route.json
          if-no-files-found: warn
          retention-days: 90
