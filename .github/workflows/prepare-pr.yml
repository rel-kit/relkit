name: Prepare pull request

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: prepare-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # workflow_run uses trusted default-branch code. PR objects are read only as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: plan
        name: Admit the run and prepare an exact-head commit from data
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          bun scripts/pr-automation.ts > "$RUNNER_TEMP/pr-preparation.json"
          if test -s "$RUNNER_TEMP/pr-preparation.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: release-app
        if: steps.plan.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Apply the prepared commit only if the PR head still matches
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: gh api --hostname github.com graphql --input "$RUNNER_TEMP/pr-preparation.json"
