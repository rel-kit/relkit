name: Railway newcomer deploy

# Opt-in: deploys a throwaway Railway project (relkit-test-<run id>), so it runs only when the
# repository variable RELKIT_TEST_RAILWAY is "1" and the RAILWAY_API_TOKEN secret holds an account
# token. RAILWAY_WORKSPACE names the workspace. The script deletes the project in a finally block.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-newcomer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  railway-newcomer:
    name: Deploy the api template to Railway
    if: ${{ vars.RELKIT_TEST_RAILWAY == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELKIT_TEST_RAILWAY: ${{ vars.RELKIT_TEST_RAILWAY }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_WORKSPACE: ${{ vars.RAILWAY_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: npm install --global @railway/cli@5.71.0
      - run: bun x turbo run build --filter='./packages/*' --filter='./integrations/packages/*' --concurrency=2 --output-logs=errors-only
      - name: Deploy, verify and delete the throwaway project; record the walkthrough timing
        run: bun scripts/walkthrough/create-to-railway.ts --output "$RUNNER_TEMP/metrics/walkthrough-railway.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: metrics-walkthrough-railway-${{ github.run_id }}
          path: ${{ runner.temp }}/metrics/walkthrough-railway.json
          if-no-files-found: warn
          retention-days: 90
