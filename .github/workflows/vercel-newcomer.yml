name: Vercel newcomer deploy

# Opt-in: deploys a throwaway Vercel project (relkit-test-<run id>) with its own database, so it runs
# only when the repository variable RELKIT_TEST_VERCEL is "1", the VERCEL_TOKEN secret holds an access
# token and the RELKIT_TEST_VERCEL_DATABASE_URL secret names a Postgres server Vercel can reach (its
# role creates and drops one database per run). VERCEL_TEAM_ID selects a team whose plan runs
# per-minute cron jobs. The script deletes the project and the database in a finally block.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-newcomer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vercel-newcomer:
    name: Deploy the api template to Vercel
    if: ${{ vars.RELKIT_TEST_VERCEL == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELKIT_TEST_VERCEL: ${{ vars.RELKIT_TEST_VERCEL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      RELKIT_TEST_VERCEL_DATABASE_URL: ${{ secrets.RELKIT_TEST_VERCEL_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun x turbo run build --filter='./packages/*' --filter='./integrations/packages/*' --concurrency=2 --output-logs=errors-only
      - name: Deploy, verify and delete the throwaway project
        run: bun scripts/vercel-newcomer.ts
