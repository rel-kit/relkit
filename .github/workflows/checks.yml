name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      certify_create:
        description: Generate reviewed creation evidence for the release branch
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  certify-create:
    name: Certify packed creation
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.certify_create &&
      github.ref == 'refs/heads/changeset-release/main'
    # Match the functional release gate; strict timing has its own manual workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TURBO_CONCURRENCY: "1"
      VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=2048
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - id: identity
        name: Read the candidate version
        run: |
          version="$(bun -p 'require("./packages/create-relkit/package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Certify the exact packed candidate
        timeout-minutes: 20
        run: bun scripts/certify-create.ts
      - name: Upload passing candidate evidence for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: create-certification-${{ github.sha }}
          path: |
            packages/create-relkit/src/create-capabilities.ts
            docs/evidence/create-capabilities/${{ steps.identity.outputs.version }}/fresh.json
            docs/evidence/create-capabilities/${{ steps.identity.outputs.version }}/restart.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed certification reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-create-certification-${{ github.run_id }}
          path: ${{ runner.temp }}/relkit-create-certification-*/*.json
          if-no-files-found: ignore
          retention-days: 7

  auto-changeset:
    name: Changeset coverage
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Require a path-based Changeset
        run: |
          node --experimental-strip-types scripts/auto-changeset.ts \
            --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --pr "$PR_NUMBER" --summary "$PR_TITLE"

  dependency-update:
    name: Normalize dependency update
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      # This job repairs the candidate; every acceptance/build job still installs frozen.
      - run: bun install --ignore-scripts
      - name: Normalize owners, synchronize derived pins and prove the resulting lockfile
        run: |
          bun scripts/dependency-update.ts
          bun run release:sync
          bun install --lockfile-only --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/sync-release.ts
          bun scripts/dependency-update.ts --export > "$RUNNER_TEMP/updates.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-update-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/updates.json
          if-no-files-found: error
          retention-days: 3

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Format, lint, and boundaries
        run: |
          bun x prettier --check AGENTS.md README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md RELEASE_NOTES.md package.json turbo.json tsconfig.base.json tsconfig.json .prettierrc.json eslint.config.mjs playwright.config.ts .changeset .github apps examples integrations packages scripts templates tests docs/testing.md
          bun run lint
          bun run check
          bun x turbo run build --filter=@relkit/contracts --output-logs=errors-only
          bun test ./tests/phase0-docs-imports.ts
          bun run konsistent -- validate
          bun run scripts/check-observability-sinks.ts

  types-and-tests:
    name: Types and focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Compile TypeScript projects
        run: |
          # The catalog depends on the excluded providers, and the root build includes them.
          bun x turbo run typecheck \
            --filter='./packages/*' \
            --filter='./integrations/packages/*' \
            --filter='!@relkit/trigger' \
            --filter='!@relkit/inngest' \
            --filter='!@relkit/effect-mq' \
            --output-logs=errors-only
      - name: Run focused tests
        run: |
          bun run test:types
          bun run test:certification
          bun x vitest run --maxWorkers=1 --no-file-parallelism scripts/tests/consumer-resources.test.ts
          bun run test:unit
          bun test tests/compiler/manifest.test.ts tests/compiler/graph-construction.test.ts tests/compiler/job-names.test.ts
          bun run test:graph
          bun run test:contracts
          bun run test:security

  inspector-container:
    name: Standalone inspector container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TURBO_CONCURRENCY: "1"
      VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=2048
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Build candidate image and prove native container behavior
        run: bun run test:container

  docs-installations:
    name: Documentation installation journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_CONCURRENCY: "1"
      VITEST_MAX_WORKERS: "1"
      NODE_OPTIONS: --max-old-space-size=2048
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Verify fresh packed installations and native documented behavior
        run: |
          bun x --bun vitest run packages/inspector/tests/platform-cohort.test.ts
          bun --cwd=apps/docs run test:installations
      - name: Verify documentation generation, examples, links and search
        run: |
          bun run test:docs
          bun --cwd=apps/docs run build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  release-readiness:
    name: Release readiness
    needs: auto-changeset
    if: >-
      !cancelled() &&
      (needs.auto-changeset.result == 'success' || needs.auto-changeset.result == 'skipped')
    uses: ./.github/workflows/release-readiness.yml
    permissions:
      contents: read

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        auto-changeset,
        dependency-update,
        static,
        types-and-tests,
        inspector-container,
        docs-installations,
        dependency-review,
        release-readiness,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      STATIC_RESULT: ${{ needs.static.result }}
      TYPES_RESULT: ${{ needs.types-and-tests.result }}
      INSPECTOR_CONTAINER_RESULT: ${{ needs.inspector-container.result }}
      DOCS_INSTALLATIONS_RESULT: ${{ needs.docs-installations.result }}
      DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
      AUTO_CHANGESET_RESULT: ${{ needs.auto-changeset.result }}
      RELEASE_READINESS_RESULT: ${{ needs.release-readiness.result }}
      DEPENDENCY_UPDATE_RESULT: ${{ needs.dependency-update.result }}
    steps:
      - name: Require fast safety jobs
        run: |
          test "$STATIC_RESULT" = success
          test "$TYPES_RESULT" = success
          test "$INSPECTOR_CONTAINER_RESULT" = success
          test "$DOCS_INSTALLATIONS_RESULT" = success
          test "$DEPENDENCY_REVIEW_RESULT" = success || test "$DEPENDENCY_REVIEW_RESULT" = skipped
          test "$AUTO_CHANGESET_RESULT" = success || test "$AUTO_CHANGESET_RESULT" = skipped
          test "$RELEASE_READINESS_RESULT" = success
          test "$DEPENDENCY_UPDATE_RESULT" = success -o "$DEPENDENCY_UPDATE_RESULT" = skipped

  dispatch-release:
    name: Dispatch release after manual main CI
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch with the exact CI run and commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f verified_sha="$VERIFIED_SHA" -f ci_run_id="$CI_RUN_ID"
