name: Release readiness

on:
  workflow_call:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CONCURRENCY: "1"
  VITEST_MAX_WORKERS: "1"
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  version:
    name: Rehearse clean versioning
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Version the real candidate or validate an already versioned batch
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main "$GITHUB_SHA"
          if test -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)"; then
            bun run version:packages
          else
            bun run build:tooling
            bun scripts/sync-release.ts
          fi
          bun install --frozen-lockfile
          bun scripts/sync-release.ts
      - name: Upload full verification reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-version-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/evidence
          if-no-files-found: ignore
          retention-days: 90
      - name: Capture source changes without compiled outputs
        run: |
          git add --all
          git diff --binary --cached HEAD > "$RUNNER_TEMP/release-candidate.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate.patch
          if-no-files-found: error
          retention-days: 3
      - name: Preserve failed creation certification reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relkit-create-certification-*/*.json
          if-no-files-found: ignore
          retention-days: 7

  pack:
    name: Rehearse clean packaging
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-rehearsal
      - name: Apply only the candidate source patch in a fresh checkout
        run: |
          patch="$RUNNER_TEMP/release-rehearsal/release-candidate.patch"
          if test -s "$patch"; then git apply --index "$patch"; fi
      - run: bun install --frozen-lockfile
      - name: Build and validate using the publishing command without publication credentials
        env:
          # Reads the repository description for the positioning check.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:pack --ci-pack --allow-dirty --output "$RUNNER_TEMP/rehearsal-pack"
      - name: Verify npm package registration
        env:
          NPM_CONFIG_FETCH_RETRIES: "1"
          NPM_CONFIG_FETCH_TIMEOUT: "15000"
        run: |
          package_names="$(jq -er '.packages[].name' "$RUNNER_TEMP/rehearsal-pack/manifest.json")"
          while IFS= read -r package_name; do
            if ! npm view "$package_name@*" name --registry=https://registry.npmjs.org > /dev/null; then
              echo "::error::Cannot verify npm package $package_name. Before merging a new package, publish its bootstrap archive and configure trusted publishing for ci.yml / environment npm. For existing packages, check registry availability."
              exit 1
            fi
          done <<< "$package_names"
      - name: Verify generated source remained stable during packaging
        run: git diff --exit-code

  dev-loop-benchmark:
    name: Benchmark the development loop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Build the packages the benchmark apps run on
        run: >-
          bun x turbo run build --filter=./packages/* --filter=./integrations/*
          --filter=./integrations/packages/*
      - name: Measure reload p95 and check memory for 10, 100 and 500 functions
        run: >-
          bun scripts/benchmark-dev-loop.ts
          --output "$GITHUB_WORKSPACE/test-results/dev-loop-benchmark/report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dev-loop-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/dev-loop-benchmark/report.json
          if-no-files-found: error
          retention-days: 90
      - name: Build the docs benchmarks page from this run's report
        env:
          RELKIT_DEV_LOOP_REPORT: ${{ github.workspace }}/test-results/dev-loop-benchmark/report.json
        run: |
          bun --cwd=apps/docs run build
          cp apps/docs/content/_snippets/generated/dev-loop-benchmarks.mdx test-results/dev-loop-benchmark/
          cp apps/docs/dist/docs/benchmarks/index.html test-results/dev-loop-benchmark/benchmarks.html
          cat apps/docs/content/_snippets/generated/dev-loop-benchmarks.mdx >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-loop-benchmark-page-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/dev-loop-benchmark/dev-loop-benchmarks.mdx
            test-results/dev-loop-benchmark/benchmarks.html
          if-no-files-found: error
          retention-days: 90
      - name: Enforce the reload and memory budgets
        run: >-
          bun scripts/check-dev-loop-budgets.ts
          --report test-results/dev-loop-benchmark/report.json

  creation-capability:
    name: Measure creation (${{ matrix.template }}, ${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, api, agent, fullstack, tasks]
        # Tier 1 runtimes. Node LTS joins this list when apps run on Node (#10).
        runtime: [bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Build the packages the packed candidate needs
        run: >-
          bun x turbo run build --filter=./packages/* --filter=./integrations/*
          --filter=./integrations/packages/*
      - name: Measure fresh and restart readiness
        run: >-
          bun scripts/create-capability-table.ts measure --template "${{ matrix.template }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: creation-capability-${{ matrix.template }}-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: test-results/creation-capability
          if-no-files-found: ignore
          retention-days: 7

  creation-capability-table:
    name: Write the creation capability table
    needs: creation-capability
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun x turbo run build --filter=create-relkit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: creation-capability-*-${{ github.run_attempt }}
          path: test-results/creation-capability
          merge-multiple: true
      - name: Merge per-template results; a failed minimal template blocks the release
        shell: bash
        run: bun scripts/create-capability-table.ts merge | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: create-capability-table-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/creation-capability
          if-no-files-found: error
          retention-days: 90

  release-evidence:
    name: Attach evidence to the rehearsed release
    needs: [pack, creation-capability-table]
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-rehearsal
      - name: Apply only the candidate source patch
        run: |
          patch="$RUNNER_TEMP/release-rehearsal/release-candidate.patch"
          if test -s "$patch"; then git apply --index "$patch"; fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/versioning
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: create-capability-table-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/creation-capability
      - name: Bundle full reports and summaries as the release asset
        run: >-
          bun scripts/release-evidence.ts bundle
          --reports "$RUNNER_TEMP/evidence/versioning"
          --reports "$RUNNER_TEMP/evidence/creation-capability"
          --output "$RUNNER_TEMP/rehearsed-release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsed-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsed-release
          if-no-files-found: error
          retention-days: 90
