name: Question
description: Ask how to do something with RELKIT.
title: "question: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: Check the [documentation](https://relkit.dev) first. If something is broken, use the bug report instead.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you tried
      description: Code, configuration, or commands you have tried so far.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: RELKIT version
      placeholder: "@relkit/cli 0.8.4"
    validations:
      required: false
