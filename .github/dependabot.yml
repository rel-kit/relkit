version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      effect-dependencies:
        patterns: ["effect", "@effect/*"]
      bun-dependencies:
        patterns: ["*"]
        exclude-patterns: ["effect", "@effect/*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/bun"
        versions: [">1.3.10"]
      - dependency-name: "effect"
        versions: [">=4.0.0-rc.0"]
      - dependency-name: "@effect/*"
        versions: [">=4.0.0-rc.0"]
      - dependency-name: "@splinetool/runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
