version: 2
# Routine upgrades are manual; security updates remain enabled in repository settings.
updates:
  - package-ecosystem: bun
    directory: /
    exclude-paths: ["repos/**"]
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
    groups:
      effect-dependencies:
        patterns: ["effect", "@effect/*"]
      bun-dependencies:
        patterns: ["*"]
        exclude-patterns: ["effect", "@effect/*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/bun"
        versions: [">1.3.10"]
      - dependency-name: "@splinetool/runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
