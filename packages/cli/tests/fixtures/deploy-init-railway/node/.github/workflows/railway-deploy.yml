# Generated by `relkit deploy init railway`. Deploys to Railway on every push to main.
# Secrets: RAILWAY_TOKEN (a Railway project token). Variables: RAILWAY_SERVICE, and optionally
# RAILWAY_WORKER_SERVICE for a separate worker service built from the same source.
name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - name: Deploy the web service
        run: bunx @railway/cli@5.71.0 up --ci --service "${{ vars.RAILWAY_SERVICE }}"
      - name: Deploy the worker service
        if: ${{ vars.RAILWAY_WORKER_SERVICE != '' }}
        run: bunx @railway/cli@5.71.0 up --ci --service "${{ vars.RAILWAY_WORKER_SERVICE }}"
