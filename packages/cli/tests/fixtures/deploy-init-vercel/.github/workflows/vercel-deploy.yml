# Generated by `relkit deploy init vercel`. Deploys to Vercel on every push to main.
# Secrets: VERCEL_TOKEN (a Vercel access token). Variables: VERCEL_ORG_ID and VERCEL_PROJECT_ID
# (from .vercel/project.json after `vercel link`).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - name: Build remotely and deploy to production
        run: bunx vercel@65.11.0 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
