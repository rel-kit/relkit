# Generated by `relkit deploy init cloudflare`. Deploys the Worker on every push to main.
# Secrets: CLOUDFLARE_API_TOKEN (a token with Workers, Workers KV, R2 and Queues edit permissions).
# Variables: CLOUDFLARE_ACCOUNT_ID. Application secrets such as DATABASE_URL are set once with
# `wrangler secret put`.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - name: Create the work queue once
        run: bunx wrangler@4.151.3 queues info my-app-relkit-work >/dev/null 2>&1 || bunx wrangler@4.151.3 queues create my-app-relkit-work
      - name: Build the Workers bundle and deploy
        run: bunx wrangler@4.151.3 deploy
